<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>优品商城</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        background: #f5f7fb;
        color: #222;
    }

    /* 顶部导航 */
    header {
        background: linear-gradient(135deg, #1e3c72, #2a5298);
        color: #fff;
        padding: 16px 4%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
        position: sticky;
        top: 0;
        z-index: 100;
    }

    .logo {
        font-size: 24px;
        font-weight: bold;
        letter-spacing: 2px;
    }

    nav a {
        color: #fff;
        text-decoration: none;
        margin-left: 24px;
        font-size: 15px;
        cursor: pointer;
        transition: 0.25s;
    }

    nav a:hover,
    nav a.active {
        color: #ffd166;
        font-weight: bold;
    }

    /* 横幅 */
    .banner {
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: #fff;
        text-align: center;
        padding: 50px 20px;
        font-size: 28px;
        font-weight: 600;
        letter-spacing: 1px;
    }

    .container {
        width: 92%;
        max-width: 1200px;
        margin: 40px auto;
    }

    .page-title {
        font-size: 26px;
        margin-bottom: 24px;
        text-align: center;
        color: #1e3c72;
    }

    /* 页面切换 */
    .page {
        display: none;
    }

    .page.show {
        display: block;
    }

    /* 分类栏 */
    .category-bar {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 12px;
        margin-bottom: 30px;
    }

    .category-btn {
        padding: 10px 22px;
        background: #fff;
        border: 1px solid #d9e2f1;
        border-radius: 30px;
        cursor: pointer;
        font-size: 14px;
        color: #333;
        transition: 0.3s;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
    }

    .category-btn:hover {
        border-color: #2a5298;
        color: #2a5298;
    }

    .category-btn.active {
        background: linear-gradient(135deg, #2a5298, #1e3c72);
        color: #fff;
        border-color: #1e3c72;
    }

    /* 商品网格 */
    .goods-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 24px;
    }

    .goods-item {
        background: #fff;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
        transition: 0.4s ease;
        display: flex;
        flex-direction: column;
        border: 1px solid #eef2f8;
    }

    .goods-item:hover {
        transform: translateY(-10px);
        box-shadow: 0 18px 40px rgba(42, 82, 152, 0.18);
    }

    /* 商品图标区：更精致的渐变插画区 */
    .goods-img {
        position: relative;
        height: 200px;
        border-radius: 16px;
        margin: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }

    .goods-img::before {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 30% 20%, rgba(255, 255, 255, 0.8), transparent 50%);
        pointer-events: none;
    }

    .goods-img .icon {
        font-size: 72px;
        filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.15));
        z-index: 2;
    }

    /* 不同品类的图标区配色 */
    .cat-mobile {
        background: linear-gradient(135deg, #74ebd5, #acb6e5);
    }

    .cat-computer {
        background: linear-gradient(135deg, #a1c4fd, #c2e9fb);
    }

    .cat-accessory {
        background: linear-gradient(135deg, #fbc2eb, #a6c1ee);
    }

    .cat-wearable {
        background: linear-gradient(135deg, #ffecd2, #fcb69f);
    }

    /* 手机与电脑：统一的精致线性插画 */
    .product-icon .device-art {
        width: 116px;
        height: 116px;
        overflow: visible;
        filter: drop-shadow(0 14px 12px rgba(30, 60, 114, 0.22));
    }

    .product-icon {
        line-height: 0;
    }

    /* 商品标签 */
    .goods-tag {
        position: absolute;
        top: 12px;
        left: 12px;
        background: rgba(255, 255, 255, 0.92);
        color: #2a5298;
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: bold;
        z-index: 3;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
    }

    /* 已加入购物车的商品件数 */
    .cart-count {
        position: absolute;
        top: 12px;
        right: 12px;
        min-width: 28px;
        height: 28px;
        padding: 0 7px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #ff6b6b, #e63946);
        color: #fff;
        border: 2px solid rgba(255, 255, 255, 0.95);
        border-radius: 20px;
        font-size: 12px;
        font-weight: bold;
        line-height: 1;
        z-index: 4;
        box-shadow: 0 4px 12px rgba(230, 57, 70, 0.3);
        pointer-events: none;
    }

    .cart-count[hidden] {
        display: none;
    }

    .goods-body {
        padding: 0 20px 22px;
        flex: 1;
        display: flex;
        flex-direction: column;
    }

    .goods-name {
        font-size: 16px;
        font-weight: 600;
        margin-bottom: 8px;
        color: #222;
    }

    .goods-category {
        font-size: 12px;
        color: #888;
        margin-bottom: 10px;
    }

    .goods-price {
        color: #e63946;
        font-size: 22px;
        font-weight: bold;
        margin-top: auto;
        margin-bottom: 14px;
    }

    .add-cart-btn {
        background: linear-gradient(135deg, #2a5298, #1e3c72);
        color: #fff;
        padding: 11px;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        font-size: 14px;
        transition: 0.3s;
        letter-spacing: 1px;
    }

    .add-cart-btn:hover {
        background: linear-gradient(135deg, #1e3c72, #16305c);
        box-shadow: 0 8px 20px rgba(42, 82, 152, 0.3);
    }

    /* 购物车面板 */
    .cart-box {
        background: #fff;
        border-radius: 20px;
        padding: 30px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
    }

    .cart-box h2 {
        margin-bottom: 20px;
        color: #1e3c72;
    }

    .cart-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 14px 0;
        border-bottom: 1px dashed #e5e7eb;
    }

    .cart-item-info {
        font-size: 15px;
    }

    .cart-item-name {
        font-weight: 600;
        margin-bottom: 4px;
    }

    .cart-item-price {
        color: #666;
        font-size: 14px;
    }

    .cart-actions {
        margin-top: 24px;
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        align-items: center;
    }

    .total-price {
        margin-left: auto;
        font-size: 20px;
        color: #e63946;
        font-weight: bold;
    }

    .clear-btn {
        background: #6c757d;
        color: #fff;
        padding: 10px 20px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
    }

    .pay-btn {
        background: linear-gradient(135deg, #06d6a0, #118c70);
        color: #fff;
        padding: 10px 24px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
    }

    .del-btn {
        background: #ef476f;
        color: #fff;
        padding: 6px 12px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 13px;
    }

    .empty-cart {
        text-align: center;
        color: #999;
        padding: 40px 0;
    }

    /* 我的页面 */
    .user-card {
        background: #fff;
        border-radius: 20px;
        padding: 40px;
        text-align: center;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
    }

    .user-avatar {
        font-size: 80px;
        margin-bottom: 16px;
    }

    .user-card h2 {
        margin-bottom: 12px;
        color: #1e3c72;
    }

    .user-card p {
        color: #666;
        margin-top: 8px;
    }

    footer {
        background: #1e3c72;
        color: #cfd8ff;
        text-align: center;
        padding: 24px;
        margin-top: 60px;
    }

    /* 手机端 */
    @media (max-width: 992px) {
        .goods-grid {
            grid-template-columns: repeat(2, 1fr);
        }
    }

    @media (max-width: 768px) {
        header {
            padding: 14px 4%;
        }

        nav a {
            margin-left: 14px;
            font-size: 14px;
        }

        .banner {
            font-size: 22px;
            padding: 40px 16px;
        }

        .goods-grid {
            grid-template-columns: 1fr;
        }

        .cart-actions {
            flex-direction: column;
            align-items: flex-start;
        }

        .total-price {
            margin-left: 0;
        }
    }
</style>
<style>
    /* 暖陶 × 墨绿：现代自然风主题 */
    :root {
        --paper: #f4f1ea;
        --surface: #fffdf8;
        --ink: #25332d;
        --muted: #7b8078;
        --forest: #23483d;
        --forest-dark: #17362e;
        --clay: #c87352;
        --clay-dark: #a9573b;
        --line: #dedfd5;
        --soft-sage: #e4e9df;
    }

    body {
        background:
            radial-gradient(circle at 8% 4%, rgba(200, 115, 82, .06), transparent 24%),
            var(--paper);
        color: var(--ink);
        font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    header {
        padding: 0 4%;
        height: 78px;
        background: rgba(244, 241, 234, .9);
        color: var(--ink);
        border-bottom: 1px solid rgba(35, 72, 61, .1);
        box-shadow: none;
        backdrop-filter: blur(18px);
    }

    .logo {
        display: flex;
        align-items: center;
        gap: 11px;
        color: var(--forest-dark);
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 3px;
    }

    .logo::before {
        content: "优";
        width: 36px;
        height: 36px;
        display: grid;
        place-items: center;
        border-radius: 11px 11px 11px 3px;
        background: var(--forest);
        color: #f8f4e9;
        font-size: 16px;
        letter-spacing: 0;
        box-shadow: 0 6px 16px rgba(35, 72, 61, .16);
    }

    nav { display: flex; align-items: center; gap: 6px; }

    nav a {
        position: relative;
        margin-left: 4px;
        padding: 10px 15px;
        color: #626b64;
        font-size: 14px;
        transition: color .25s, background .25s;
    }

    nav a::after {
        content: "";
        position: absolute;
        left: 15px;
        right: 15px;
        bottom: 2px;
        height: 2px;
        border-radius: 2px;
        background: var(--clay);
        transform: scaleX(0);
        transition: transform .25s;
    }

    nav a:hover,
    nav a.active {
        color: var(--forest-dark);
        font-weight: 600;
    }

    nav a.active::after { transform: scaleX(1); }

    nav a:nth-child(3) {
        margin-left: 10px;
        padding: 10px 20px;
        border-radius: 24px;
        background: var(--forest);
        color: #fff;
    }

    nav a:nth-child(3)::after { display: none; }
    nav a:nth-child(3):hover,
    nav a:nth-child(3).active { background: var(--clay-dark); color: #fff; }

    .banner {
        position: relative;
        isolation: isolate;
        overflow: hidden;
        min-height: 310px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: flex-start;
        padding: 58px max(6%, calc((100% - 1200px) / 2));
        background:
            radial-gradient(circle at 82% 18%, rgba(224, 181, 141, .25), transparent 27%),
            radial-gradient(circle at 70% 110%, rgba(133, 163, 137, .22), transparent 38%),
            linear-gradient(125deg, #17362e, #294f43);
        color: #fffaf0;
        text-align: left;
        font-size: clamp(30px, 4vw, 48px);
        font-weight: 600;
        letter-spacing: 4px;
    }

    .banner::before {
        content: "NEW SEASON  /  SMART LIVING";
        position: static;
        inset: auto;
        width: auto;
        height: auto;
        margin-bottom: 18px;
        color: #d9b497;
        background: none;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 4px;
    }

    .banner::after {
        content: "以科技点亮日常，让每一个选择都更简单";
        position: static;
        inset: auto;
        width: auto;
        height: auto;
        margin-top: 20px;
        padding-top: 18px;
        border-top: 1px solid rgba(255, 255, 255, .2);
        color: rgba(255, 250, 240, .7);
        background: none;
        font-size: 13px;
        font-weight: 400;
        letter-spacing: 2px;
    }

    .container { margin-top: 48px; margin-bottom: 70px; }

    .page-title {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 26px;
        color: var(--forest-dark);
        text-align: left;
        font-size: 27px;
        letter-spacing: 1px;
    }

    .page-title::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--line);
    }

    .category-bar { justify-content: flex-start; gap: 10px; margin-bottom: 32px; }

    .category-btn {
        padding: 9px 20px;
        border: 1px solid #d4d7ce;
        border-radius: 24px;
        background: transparent;
        color: #6b736c;
        box-shadow: none;
        font-size: 13px;
    }

    .category-btn:hover {
        border-color: var(--forest);
        background: rgba(255, 253, 248, .6);
        color: var(--forest);
    }

    .category-btn.active {
        border-color: var(--forest);
        background: var(--forest);
        color: #fff;
        box-shadow: 0 5px 14px rgba(35, 72, 61, .12);
    }

    .goods-grid { gap: 26px 22px; }

    .goods-item {
        position: relative;
        overflow: hidden;
        border: 1px solid rgba(35, 72, 61, .08);
        border-radius: 18px;
        background: var(--surface);
        box-shadow: 0 5px 18px rgba(38, 49, 42, .04);
        transition: transform .35s ease, box-shadow .35s ease, border-color .35s ease;
    }

    .goods-item:hover {
        transform: translateY(-7px);
        border-color: rgba(35, 72, 61, .16);
        box-shadow: 0 18px 38px rgba(38, 49, 42, .11);
    }

    .goods-img {
        height: 210px;
        margin: 10px;
        border-radius: 13px;
    }

    .goods-img::before {
        background: radial-gradient(circle at 28% 18%, rgba(255, 255, 255, .75), transparent 48%);
    }

    .cat-mobile { background: linear-gradient(145deg, #dce8df, #b8cfc3); }
    .cat-computer { background: linear-gradient(145deg, #ebe5da, #d6c5ae); }
    .cat-accessory { background: linear-gradient(145deg, #eee0d5, #dfbda9); }
    .cat-wearable { background: linear-gradient(145deg, #e4e4da, #c5cbb7); }

    .product-icon .device-art { filter: drop-shadow(0 14px 12px rgba(35, 55, 45, .2)); }

    .goods-tag {
        top: 13px;
        left: 13px;
        padding: 5px 11px;
        border-radius: 5px;
        background: rgba(255, 253, 248, .9);
        color: var(--forest);
        box-shadow: none;
        font-size: 10px;
        letter-spacing: 1px;
        backdrop-filter: blur(8px);
    }

    .cart-count {
        background: var(--clay);
        border-color: rgba(255, 253, 248, .95);
        box-shadow: 0 4px 12px rgba(169, 87, 59, .24);
    }

    .goods-body { padding: 7px 20px 20px; }

    .goods-name {
        margin-bottom: 5px;
        color: var(--ink);
        font-size: 17px;
        font-weight: 600;
        letter-spacing: .3px;
    }

    .goods-category {
        margin-bottom: 16px;
        color: #8a8f86;
        font-size: 11px;
        letter-spacing: 1.5px;
    }

    .goods-price {
        margin-bottom: 15px;
        color: var(--clay-dark);
        font-family: Georgia, "Times New Roman", serif;
        font-size: 24px;
        font-weight: 600;
    }

    .add-cart-btn {
        position: relative;
        padding: 12px 15px;
        border-radius: 9px;
        background: var(--forest);
        color: #fff;
        font-size: 12px;
        letter-spacing: 1px;
        transition: background .25s, box-shadow .25s;
    }

    .add-cart-btn::after { content: "  ↗"; font-size: 15px; }

    .add-cart-btn:hover {
        background: var(--clay-dark);
        box-shadow: 0 7px 16px rgba(169, 87, 59, .2);
    }

    .cart-box,
    .user-card {
        border: 1px solid rgba(35, 72, 61, .08);
        border-radius: 20px;
        background: var(--surface);
        box-shadow: 0 8px 28px rgba(38, 49, 42, .05);
    }

    .cart-box { padding: 34px; }
    .cart-box h2,
    .user-card h2 { color: var(--forest-dark); letter-spacing: 1px; }
    .cart-item { padding: 19px 2px; border-bottom: 1px solid var(--line); }
    .cart-item-name { color: var(--ink); }
    .cart-item-price { color: var(--muted); }

    .clear-btn {
        border: 1px solid #d2d5cd;
        border-radius: 8px;
        background: transparent;
        color: #687169;
        padding: 11px 20px;
    }
    .clear-btn:hover { border-color: var(--forest); color: var(--forest); }

    .pay-btn {
        border-radius: 8px;
        background: var(--forest);
        padding: 12px 24px;
    }
    .pay-btn:hover { background: var(--clay-dark); }

    .total-price { color: var(--clay-dark); font-family: Georgia, serif; }

    .del-btn {
        border: 1px solid #e4c9bc;
        border-radius: 7px;
        background: transparent;
        color: var(--clay-dark);
        padding: 6px 13px;
    }
    .del-btn:hover { background: #f7e9e1; }

    .empty-cart { color: #92978f; }

    .user-card {
        position: relative;
        overflow: hidden;
        max-width: 760px;
        margin: 10px auto;
        padding: 48px 40px;
        background: linear-gradient(145deg, #fffdf8, #edf0e7);
    }

    .user-card::before {
        content: "";
        position: absolute;
        width: 210px;
        height: 210px;
        right: -80px;
        top: -95px;
        border-radius: 50%;
        background: rgba(200, 115, 82, .11);
    }

    .user-avatar {
        width: 82px;
        height: 82px;
        display: grid;
        place-items: center;
        margin: 0 auto 20px;
        border-radius: 50%;
        background: var(--soft-sage);
        font-size: 46px;
    }
    .user-card p { color: var(--muted); }

    footer {
        margin-top: 20px;
        padding: 30px 24px;
        background: var(--forest-dark);
        color: #bdc9be;
        font-size: 12px;
        letter-spacing: 1px;
    }

    @media (max-width: 768px) {
        header { height: auto; min-height: 72px; padding: 12px 4%; gap: 12px; }
        .logo { font-size: 18px; gap: 8px; }
        .logo::before { width: 32px; height: 32px; font-size: 14px; }
        nav { gap: 0; }
        nav a { margin-left: 0; padding: 8px 7px; font-size: 12px; }
        nav a:nth-child(3) { margin-left: 3px; padding: 8px 11px; }
        .banner { min-height: 270px; padding: 45px 7%; font-size: 29px; letter-spacing: 2px; }
        .banner::after { font-size: 12px; letter-spacing: 1px; }
        .container { margin-top: 34px; }
        .page-title { font-size: 23px; }
        .goods-grid { grid-template-columns: repeat(2, 1fr); gap: 18px 12px; }
        .goods-img { height: 175px; }
        .goods-body { padding: 5px 14px 15px; }
        .goods-name { font-size: 15px; }
        .cart-box { padding: 24px 20px; }
    }

    @media (max-width: 480px) {
        header { flex-direction: column; align-items: flex-start; }
        nav { width: 100%; justify-content: space-between; }
        .goods-grid { grid-template-columns: 1fr; }
        .goods-img { height: 230px; }
        .goods-body { padding: 7px 18px 19px; }
        .category-btn { padding: 8px 16px; }
        .cart-actions { align-items: stretch; }
        .total-price { text-align: right; }
    }
</style>
<style>
    /* 奶油粉 × 莓果红：柔和甜酷风主题 */
    :root {
        --paper: #fff5f7;
        --surface: #fffdfc;
        --ink: #49333d;
        --muted: #9a7f89;
        --forest: #b95476;
        --forest-dark: #85344f;
        --clay: #e68ca5;
        --clay-dark: #bd5272;
        --line: #efdbe1;
        --soft-sage: #fbe5eb;
    }

    body {
        background:
            radial-gradient(circle at 5% 10%, rgba(244, 174, 194, .18), transparent 25%),
            radial-gradient(circle at 96% 38%, rgba(221, 188, 218, .16), transparent 24%),
            var(--paper);
        color: var(--ink);
    }

    header {
        height: 82px;
        background: rgba(255, 245, 247, .88);
        border-bottom: 1px solid rgba(185, 84, 118, .1);
        box-shadow: 0 5px 22px rgba(139, 69, 91, .04);
    }

    .logo { color: var(--forest-dark); letter-spacing: 2px; }
    .logo::before {
        width: 40px;

    // 渲染商品列表
    function renderGoods(gridId, category) {
        const grid = document.getElementById(gridId);
        let list = goodsList.filter(item => item.status === 1);

        if (category !== '全部') {
            list = list.filter(item => item.category === category);
        }

        grid.innerHTML = list.map(item => {
            const cartItem = cart.find(cartItem => cartItem.id === item.id);
            const count = cartItem ? cartItem.count : 0;

            return `
                <div class="goods-item">
                    <div class="goods-img ${item.catClass}">
                        <span class="goods-tag">${item.tag}</span>
                        <span class="cart-count" data-product-id="${item.id}" aria-label="购物车中已有 ${count} 件" ${count === 0 ? 'hidden' : ''}>${count}</span>
                        <span class="icon ${productIcons[item.id] ? 'product-icon' : ''}">${getProductIcon(item, gridId)}</span>
                    </div>
                    <div class="goods-body">
                        <div class="goods-name">${item.name}</div>
                        <div class="goods-category">${item.category}</div>
                        <div class="goods-price">¥${item.price}</div>
                        <button class="add-cart-btn" onclick="addCart(${item.id})">
                            加入购物车
                        </button>
                    </div>
                </div>
            `;
        }).join('');
    }

    // 分类筛选
    function filterCategory(category, page) {
        const prefix = page === 'home' ? 'home' : 'goods';

        document.querySelectorAll(`#${page} .category-btn`).forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');

        renderGoods(`${prefix}Grid`, category);
    }

    // 下架商品自动移出购物车，其他商品同步最新名称和价格
    function syncCartWithGoods() {
        cart = cart.reduce((validItems, cartItem) => {
            const product = goodsList.find(item => item.id === cartItem.id);
            if (product && product.status === 1) {
                validItems.push({
                    ...cartItem,
                    name: product.name,
                    price: product.price
                });
            }
            return validItems;
        }, []);
    }

    // 加入购物车
    function addCart(id) {
        const product = goodsList.find(item => item.id === id && item.status === 1);
        if (!product) {
            alert('该商品已下架，无法加入购物车！');
            return;
        }

        const exist = cart.find(item => item.id === id);
        if (exist) {
            exist.count += 1;
        } else {
            cart.push({ id: product.id, name: product.name, price: product.price, count: 1 });
        }
        renderCart();
    }

    // 删除单个商品
    function delItem(index) {
        cart.splice(index, 1);
        renderCart();
    }

    // 清空购物车
    function clearCart() {
        cart = [];
        renderCart();
    }

    // 提交订单并写入 admin 共用的订单缓存
    function submitOrder() {
        goodsList = loadGoods();
        syncCartWithGoods();

        if (cart.length === 0) {
            alert("购物车为空，不能下单！");
            renderGoods('homeGrid', '全部');
            renderGoods('goodsGrid', '全部');
            renderCart();
            return;
        }

        const total = cart.reduce((sum, item) => sum + item.price * item.count, 0);
        const now = new Date();
        let orders = [];

        try {
            const parsedOrders = JSON.parse(localStorage.getItem(ORDER_STORAGE_KEY) || '[]');
            orders = Array.isArray(parsedOrders) ? parsedOrders : [];
        } catch (error) {
            console.warn('订单缓存读取失败，已重新创建订单列表。', error);
        }

        orders.unshift({
            oid: `UP${now.getTime()}`,
            items: cart.map(item => ({ ...item })),
            productName: cart.map(item => `${item.name} × ${item.count}`).join('；'),
            time: now.toLocaleString('zh-CN', { hour12: false }),
            total,
            status: 'pending'
        });
        localStorage.setItem(ORDER_STORAGE_KEY, JSON.stringify(orders));

        alert(`下单成功！订单总金额：¥${total}，感谢购买！`);
        cart = [];
        renderCart();
    }

    // 同步首页和全部商品页的购物车数量角标
    function updateCartBadges() {
        document.querySelectorAll('.cart-count[data-product-id]').forEach(badge => {
            const productId = Number(badge.dataset.productId);
            const cartItem = cart.find(item => item.id === productId);
            const count = cartItem ? cartItem.count : 0;

            badge.textContent = count;
            badge.setAttribute('aria-label', `购物车中已有 ${count} 件`);
            badge.hidden = count === 0;
        });
    }

    // 渲染购物车
    function renderCart() {
        syncCartWithGoods();
        updateCartBadges();

        const cartList = document.getElementById("cartList");
        const totalPrice = document.getElementById("totalPrice");
          if (cart.length === 0) {
            cartList.innerHTML = '<div class="empty-cart">购物车是空的，请添加商品</div>';
            totalPrice.innerText = "0";
            return;
        }

        cartList.innerHTML = cart.map((item, index) => `
            <div class="cart-item">
                <div class="cart-item-info">
                    <div class="cart-item-name">${item.name}</div>

                    </div>
                </div>
                <button class="del-btn" onclick="delItem(${index})">删除</button>
            </div>
        `).join('');

        let total = cart.reduce((sum, item) => sum + item.price * item.count, 0);
        totalPrice.innerText = total;
    }

    // admin 在其他标签页修改商品后，立即刷新店铺并过滤购物车
    window.addEventListener('storage', event => {
        if (event.key !== GOODS_STORAGE_KEY) return;

        goodsList = loadGoods();
        renderGoods('homeGrid', '全部');
        renderGoods('goodsGrid', '全部');
        renderCart();
    });

    // 初始化
    renderGoods('homeGrid', '全部');
    renderGoods('goodsGrid', '全部');
    renderCart();
</script>
</body>
</html>
